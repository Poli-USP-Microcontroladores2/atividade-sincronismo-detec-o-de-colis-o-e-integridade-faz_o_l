CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Habilita a API de GPIO (Fundamental)
CONFIG_GPIO=y

# Habilita o sistema de Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Aumenta a stack da thread 'main' (onde a máquina de estados roda)
CONFIG_MAIN_STACK_SIZE=2048

# Habilita UART0 (PTA1/PTA2)
CONFIG_UART_MCUX=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Se você quiser garantir que NÃO usa o shell UART:
CONFIG_SHELL=n
CONFIG_UART_CONSOLE=n